<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagesspruch Mini-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-amber-100 selection:text-amber-900">

  <!-- Top Header -->
  <header class="w-full max-w-4xl mx-auto px-6 pt-8 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold shadow-md shadow-amber-500/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>
      <span class="font-bold text-slate-900 text-lg tracking-tight">Tagesspruch</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="toggleFavoritesBtn" onclick="toggleFavoritesDrawer()" class="text-xs font-medium text-slate-600 hover:text-slate-900 bg-white border border-slate-200 hover:border-slate-300 rounded-lg px-3 py-1.5 transition-all flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <span>Favoriten</span>
        <span id="favCountBadge" class="ml-1 bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-xl mx-auto px-4 py-8 my-auto flex flex-col items-center gap-6">
    
    <!-- QuoteDisplayCard -->
    <div id="quoteCard" class="w-full bg-white rounded-2xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8 sm:p-10 transition-all duration-300 flex flex-col relative overflow-hidden">
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-400"></div>
      
      <!-- Top Card Header: ID & Actions -->
      <div class="flex items-center justify-between mb-6">
        <span id="quoteIdTag" class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200/60">
          Spruch #--
        </span>
        <div class="flex items-center gap-1">
          <!-- Speak Button -->
          <button onclick="speakQuote()" title="Vorlesen" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
          </button>
          <!-- Copy Button -->
          <button onclick="copyQuote()" title="Kopieren" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </button>
          <!-- Favorite Button -->
          <button id="bookmarkBtn" onclick="toggleFavorite()" title="Speichern" class="p-2 text-slate-400 hover:text-amber-500 rounded-lg hover:bg-slate-50 transition-colors">
            <svg id="bookmarkIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Quote Content -->
      <div class="min-h-[120px] flex items-center justify-center my-2 text-center relative">
        <svg class="absolute top-0 left-0 text-slate-100 w-12 h-12 -z-0 pointer-events-none -translate-x-2 -translate-y-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
        </svg>
        <p id="quoteText" class="text-xl sm:text-2xl font-medium leading-relaxed text-slate-800 z-10 transition-opacity duration-200">
          Lade Inspiration...
        </p>
      </div>

      <!-- Status / Notification Toast inside Card -->
      <div id="cardToast" class="opacity-0 transition-opacity duration-200 text-center text-xs font-medium text-amber-700 bg-amber-50 rounded-md py-1 px-3 mt-4 self-center">
        In die Zwischenablage kopiert!
      </div>
    </div>

    <!-- GetQuoteButton -->
    <div class="flex flex-col items-center gap-3 w-full">
      <button id="getQuoteBtn" onclick="fetchQuote()" class="w-full sm:w-auto px-8 py-3.5 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-medium rounded-xl shadow-lg shadow-slate-900/10 hover:shadow-slate-900/20 transition-all flex items-center justify-center gap-2 group cursor-pointer focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">
        <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <svg id="btnIcon" class="w-4 h-4 transition-transform group-hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span id="btnLabel">Neuer Spruch</span>
      </button>
      <p class="text-xs text-slate-400">Ruft <code class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono text-[11px]">GET /api/quote</code> auf</p>
    </div>
  </main>

  <!-- Favorites Drawer / Modal -->
  <div id="favDrawer" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end transition-opacity">
    <div class="w-full max-w-md bg-white h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto animate-fade-in">
      <div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            Gespeicherte Sprüche
          </h2>
          <button onclick="toggleFavoritesDrawer()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div id="favList" class="space-y-3">
          <!-- Favorite items dynamically inserted here -->
        </div>
      </div>
      <div class="pt-4 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400">In Deinem Browser gespeichert</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full max-w-4xl mx-auto px-6 py-6 text-center text-xs text-slate-400 border-t border-slate-100/80">
    Tagesspruch Mini-App &bull; Minimalistisches Design
  </footer>

  <!-- Application Logic -->
  <script>
    // State
    let currentQuote = null;
    let favorites = JSON.parse(localStorage.getItem('tagesspruch_favorites') || '[]');

    // DOM Elements
    const quoteTextEl = document.getElementById('quoteText');
    const quoteIdTagEl = document.getElementById('quoteIdTag');
    const quoteCardEl = document.getElementById('quoteCard');
    const getQuoteBtn = document.getElementById('getQuoteBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnIcon = document.getElementById('btnIcon');
    const btnLabel = document.getElementById('btnLabel');
    const bookmarkIcon = document.getElementById('bookmarkIcon');
    const favCountBadge = document.getElementById('favCountBadge');
    const cardToast = document.getElementById('cardToast');

    // Fetch Quote function
    async function fetchQuote() {
      setLoading(true);
      try {
        const response = await fetch('/api/quote');
        if (!response.ok) throw new Error('Netzwerkfehler');
        const data = await response.json();
        
        // Render with slight fade animation
        quoteTextEl.style.opacity = '0';
        setTimeout(() => {
          currentQuote = data;
          quoteTextEl.textContent = `“${data.quote}”`;
          quoteIdTagEl.textContent = `Spruch #${data.id}`;
          quoteTextEl.style.opacity = '1';
          updateBookmarkState();
        }, 150);
        
      } catch (err) {
        console.error('Fetch Quote error:', err);
        showToast('Fehler beim Laden des Spruchs');
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      getQuoteBtn.disabled = isLoading;
      if (isLoading) {
        btnSpinner.classList.remove('hidden');
        btnIcon.classList.add('hidden');
        btnLabel.textContent = 'Lade...';
      } else {
        btnSpinner.classList.add('hidden');
        btnIcon.classList.remove('hidden');
        btnLabel.textContent = 'Neuer Spruch';
      }
    }

    // Copy quote
    function copyQuote() {
      if (!currentQuote) return;
      navigator.clipboard.writeText(`"${currentQuote.quote}"`)
        .then(() => showToast('In die Zwischenablage kopiert!'))
        .catch(() => showToast('Kopieren fehlgeschlagen'));
    }

    // Text to Speech
    function speakQuote() {
      if (!currentQuote || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentQuote.quote);
      utterance.lang = 'de-DE';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
      showToast('Lese vor...');
    }

    // Toast alert
    let toastTimeout;
    function showToast(msg) {
      cardToast.textContent = msg;
      cardToast.classList.remove('opacity-0');
      cardToast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        cardToast.classList.remove('opacity-100');
        cardToast.classList.add('opacity-0');
      }, 2000);
    }

    // Favorites Management
    function updateFavBadge() {
      favCountBadge.textContent = favorites.length;
    }

    function updateBookmarkState() {
      if (!currentQuote) return;
      const isFav = favorites.some(item => item.id === currentQuote.id && item.quote === currentQuote.quote);
      if (isFav) {
        bookmarkIcon.setAttribute('fill', 'currentColor');
        bookmarkIcon.classList.add('text-amber-500');
      } else {
        bookmarkIcon.setAttribute('fill', 'none');
        bookmarkIcon.classList.remove('text-amber-500');
      }
    }

    function toggleFavorite() {
      if (!currentQuote) return;
      const index = favorites.findIndex(item => item.id === currentQuote.id && item.quote === currentQuote.quote);
      if (index >= 0) {
        favorites.splice(index, 1);
        showToast('Aus Favoriten entfernt');
      } else {
        favorites.push(currentQuote);
        showToast('Zu Favoriten hinzugefügt');
      }
      localStorage.setItem('tagesspruch_favorites', JSON.stringify(favorites));
      updateBookmarkState();
      updateFavBadge();
      renderFavoritesList();
    }

    function toggleFavoritesDrawer() {
      const drawer = document.getElementById('favDrawer');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        renderFavoritesList();
      } else {
        drawer.classList.add('hidden');
      }
    }

    function renderFavoritesList() {
      const listEl = document.getElementById('favList');
      listEl.textContent = '';

      if (favorites.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'text-center py-12 text-slate-400 text-sm';
        emptyDiv.textContent = 'Noch keine Favoriten gespeichert.';
        listEl.appendChild(emptyDiv);
        return;
      }

      favorites.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'p-4 bg-slate-50 border border-slate-200/80 rounded-xl flex items-start justify-between gap-3 text-sm';

        const contentDiv = document.createElement('div');

        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'text-[10px] font-bold text-amber-700 bg-amber-100/60 px-1.5 py-0.5 rounded';
        badgeSpan.textContent = `#${item.id}`;

        const quotePara = document.createElement('p');
        quotePara.className = 'mt-1 text-slate-700 font-medium leading-relaxed';
        quotePara.textContent = `“${item.quote}”`;

        contentDiv.appendChild(badgeSpan);
        contentDiv.appendChild(quotePara);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'text-slate-300 hover:text-red-500 p-1 flex-shrink-0 transition-colors';
        deleteBtn.title = 'Löschen';
        deleteBtn.onclick = () => removeFavoriteByIndex(idx);
        deleteBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';

        card.appendChild(contentDiv);
        card.appendChild(deleteBtn);

        listEl.appendChild(card);
      });
    }

    function removeFavoriteByIndex(index) {
      favorites.splice(index, 1);
      localStorage.setItem('tagesspruch_favorites', JSON.stringify(favorites));
      updateFavBadge();
      updateBookmarkState();
      renderFavoritesList();
    }

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      updateFavBadge();
      fetchQuote();
    });
  </script>
</body>
</html>
