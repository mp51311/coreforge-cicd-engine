<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        heading: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans flex flex-col justify-between antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <!-- Header -->
    <header class="w-full max-w-4xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-serif font-bold text-lg shadow-sm">
                ”
            </div>
            <span class="font-semibold text-slate-800 tracking-tight text-sm">QuoteGen</span>
        </div>
        <span class="text-xs text-slate-400 font-medium bg-slate-100 px-3 py-1 rounded-full">Mini-App</span>
    </header>

    <!-- Main View -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 text-center space-y-8 relative overflow-hidden transition-all duration-300">
            <!-- Background Accent -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="space-y-1">
                <h1 class="text-xs font-semibold uppercase tracking-widest text-indigo-600">Inspiration</h1>
                <p class="text-2xl font-heading font-semibold text-slate-800">Tägliche Zitate</p>
            </div>

            <!-- Quote Display Box -->
            <div id="quote-container" class="min-h-[160px] flex flex-col items-center justify-center relative p-6 rounded-xl bg-slate-50/80 border border-slate-100/80 transition-opacity duration-300">
                <svg class="w-8 h-8 text-indigo-200 mb-3" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                </svg>

                <p id="quote-text" class="text-slate-700 text-lg md:text-xl font-serif italic leading-relaxed transition-opacity duration-300 opacity-100">
                    Lade Zitat...
                </p>

                <div id="loader" class="hidden absolute inset-0 bg-slate-50/90 rounded-xl flex items-center justify-center">
                    <div class="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>

            <!-- Action Button -->
            <button id="fetch-btn" class="w-full group bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium py-3.5 px-6 rounded-xl shadow-md shadow-indigo-100 transition-all duration-200 flex items-center justify-center gap-2">
                <span>Zitat zeigen</span>
                <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 text-xs text-slate-400">
        Clean Minimalist Card Layout &bull; Tailwind CSS & Vanilla JS
    </footer>

    <script>
        const quoteText = document.getElementById('quote-text');
        const fetchBtn = document.getElementById('fetch-btn');
        const loader = document.getElementById('loader');

        async function fetchQuote() {
            loader.classList.remove('hidden');
            fetchBtn.disabled = true;
            fetchBtn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const res = await fetch('/api/quote');
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                const data = await res.json();
                
                quoteText.classList.add('opacity-0');
                setTimeout(() => {
                    quoteText.textContent = data.quote;
                    quoteText.classList.remove('opacity-0');
                }, 150);
            } catch (err) {
                quoteText.textContent = "Fehler beim Laden des Zitats.";
            } finally {
                setTimeout(() => {
                    loader.classList.add('hidden');
                    fetchBtn.disabled = false;
                    fetchBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                }, 200);
            }
        }

        fetchBtn.addEventListener('click', fetchQuote);
        fetchQuote();
    </script>
</body>
</html>
