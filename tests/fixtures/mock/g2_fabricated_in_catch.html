<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zufälliger Fakt Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 flex flex-col items-center text-center transition-all">
    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-4 text-xl">
      <i class="fa-solid fa-lightbulb"></i>
    </div>
    <h1 class="text-xl font-bold text-slate-900 mb-6">Wusstest du schon?</h1>

    <!-- Fact Display Card -->
    <div class="w-full bg-slate-50 rounded-xl p-6 mb-6 min-h-[140px] flex items-center justify-center relative border border-slate-100">
      <!-- Loading Spinner Indicator -->
      <div id="spinner" class="hidden flex flex-col items-center justify-center space-y-2 text-indigo-600">
        <svg class="animate-spin h-7 w-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Lade Fakt...</span>
      </div>

      <!-- Fact Text -->
      <p id="fact-text" class="text-slate-700 text-base leading-relaxed italic font-serif">Klicke unten, um deinen ersten zufälligen Fakt zu laden!</p>
    </div>

    <!-- Trigger Button -->
    <button id="fetch-btn" onclick="getFact()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md shadow-indigo-100 transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer">
      <i class="fa-solid fa-shuffle text-sm" id="btn-icon"></i>
      <span>Fakt zeigen</span>
    </button>
  </div>

  <script>
    const mockFacts = [
      "Honig verdirbt niemals. Archäologen haben 3.000 Jahre alten Honig in ägyptischen Gräbern gefunden, der noch essbar war.",
      "Oktopusse besitzen drei Herzen und ihr Blut ist blau.",
      "Bananen sind botanisch gesehen Beeren, Erdbeeren hingegen nicht.",
      "Ein Tag auf der Venus ist länger als ein ganzes Jahr auf der Venus.",
      "Der Eiffelturm kann im Sommer durch die Hitzeausdehnung des Metalls bis zu 15 cm höher sein."
    ];

    async function getFact() {
      const spinner = document.getElementById('spinner');
      const factText = document.getElementById('fact-text');
      const btn = document.getElementById('fetch-btn');
      const btnIcon = document.getElementById('btn-icon');

      // UI Loading state
      spinner.classList.remove('hidden');
      factText.classList.add('hidden');
      btn.disabled = true;
      btn.classList.add('opacity-75', 'cursor-not-allowed');
      btnIcon.classList.add('animate-spin');

      try {
        let fact = '';
        try {
          const res = await fetch('/api/fact');
          if (!res.ok) throw new Error('API request failed');
          const data = await res.json();
          fact = data.fact;
        } catch (e) {
          // Fallback mock logic for offline/standalone execution
          await new Promise(r => setTimeout(r, 400));
          fact = mockFacts[Math.floor(Math.random() * mockFacts.length)];
        }
        factText.textContent = `"${fact}"`;
      } catch (err) {
        factText.textContent = "Fehler beim Laden des Fakts. Bitte versuche es erneut.";
      } finally {
        spinner.classList.add('hidden');
        factText.classList.remove('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        btnIcon.classList.remove('animate-spin');
      }
    }
  </script>
</body>
</html>
