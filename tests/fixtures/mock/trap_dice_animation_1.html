<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-App Würfel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

  <main class="w-full max-w-sm bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center">

    <!-- Background Glow -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-violet-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <header class="mb-8 relative z-10">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-3 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Würfel</h1>
      <p class="text-xs text-slate-400 mt-1">Klicke, um eine Zahl von 1 bis 6 zu würfeln</p>
    </header>

    <!-- Error State Box -->
    <div id="error-box" class="hidden mb-6 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-300 text-xs text-left flex items-start gap-2.5 relative z-10 transition-all duration-200">
      <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="error-message">Fehler beim Würfeln.</span>
    </div>

    <!-- Result Display Section -->
    <div class="relative z-10 mb-8 flex flex-col items-center">
      <div id="dice-container" class="w-36 h-36 bg-slate-900/90 border-2 border-indigo-500/30 rounded-3xl flex flex-col items-center justify-center shadow-inner relative transition-transform duration-300">
        
        <!-- Result Display Box (Large Typography) -->
        <span id="result-display" class="text-6xl font-extrabold text-indigo-400 tracking-tight transition-all duration-100">?</span>
        
        <!-- Visual Dice Pips Grid -->
        <div id="pips-grid" class="hidden grid-cols-3 gap-1.5 w-12 h-12 mt-2 items-center justify-items-center"></div>
      </div>

      <!-- Loading / Animation State Indicator -->
      <div id="status-indicator" class="h-6 mt-4 flex items-center justify-center gap-2 text-xs text-slate-400 font-medium">
        <span id="status-text">Bereit zum Würfeln</span>
      </div>
    </div>

    <!-- Roll Button -->
    <div class="relative z-10">
      <button id="roll-btn" type="button" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 border border-indigo-400/30 transition-all duration-150 flex items-center justify-center gap-2 group">
        <svg id="roll-icon" class="w-5 h-5 transition-transform group-hover:rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span id="btn-text">Würfeln</span>
      </button>
    </div>

  </main>

  <script>
    const rollBtn = document.getElementById('roll-btn');
    const resultDisplay = document.getElementById('result-display');
    const pipsGrid = document.getElementById('pips-grid');
    const statusText = document.getElementById('status-text');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');
    const diceContainer = document.getElementById('dice-container');

    let isRolling = false;
    let animInterval = null;

    function renderPips(number) {
      pipsGrid.replaceChildren();
      if (!number || number < 1 || number > 6) {
        pipsGrid.classList.add('hidden');
        pipsGrid.classList.remove('grid');
        return;
      }

      pipsGrid.classList.remove('hidden');
      pipsGrid.classList.add('grid');

      const pipPositions = {
        1: [4],
        2: [2, 6],
        3: [2, 4, 6],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
      };

      const activePositions = pipPositions[number] || [];

      for (let i = 0; i < 9; i++) {
        const dot = document.createElement('div');
        dot.className = activePositions.includes(i)
          ? 'w-2 h-2 rounded-full bg-indigo-400 shadow-sm shadow-indigo-400/50'
          : 'w-2 h-2 opacity-0';
        pipsGrid.appendChild(dot);
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    async function rollDice() {
      if (isRolling) return;

      isRolling = true;
      hideError();
      rollBtn.disabled = true;

      statusText.textContent = 'Würfel rollt...';
      diceContainer.classList.add('animate-pulse');

      let currentRandom = 1;
      animInterval = setInterval(() => {
        currentRandom = Math.floor(Math.random() * 6) + 1;
        resultDisplay.textContent = currentRandom;
      }, 70);

      try {
        const response = await fetch('/api/roll');
        
        if (!response.ok) {
          throw new Error(`Server-Fehler (Status ${response.status})`);
        }

        const data = await response.json();

        if (typeof data.result !== 'number' || data.result < 1 || data.result > 6) {
          throw new Error('Ungültiges Würfelergebnis vom Server.');
        }

        await new Promise(res => setTimeout(res, 250));

        clearInterval(animInterval);
        animInterval = null;

        resultDisplay.textContent = data.result;
        renderPips(data.result);
        statusText.textContent = `Ergebnis: ${data.result}`;

      } catch (err) {
        if (animInterval) {
          clearInterval(animInterval);
          animInterval = null;
        }
        resultDisplay.textContent = '!';
        renderPips(0);
        statusText.textContent = 'Fehler aufgetreten';
        showError(err.message || 'Verbindung zum Server konnte nicht hergestellt werden.');
      } finally {
        diceContainer.classList.remove('animate-pulse');
        isRolling = false;
        rollBtn.disabled = false;
      }
    }

    rollBtn.addEventListener('click', rollDice);
  </script>
</body>
</html>
