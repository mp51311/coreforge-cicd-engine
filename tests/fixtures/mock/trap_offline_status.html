<!DOCTYPE html>
<html lang="de" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server-Uhr</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .digital-glow {
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 40px rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-zinc-950 text-zinc-100 flex flex-col items-center justify-center p-4 select-none">

  <!-- Subtle background grid effect -->
  <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:24px_24px] opacity-25"></div>

  <!-- Main Clock Card -->
  <main class="relative z-10 w-full max-w-lg bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-6 sm:p-10 shadow-2xl shadow-black/80 flex flex-col gap-8">
    
    <!-- Header / Status Indicator -->
    <header class="flex items-center justify-between border-b border-zinc-800/60 pb-5">
      <div class="flex items-center gap-3">
        <div class="p-2 rounded-xl bg-zinc-800/80 border border-zinc-700/50 text-zinc-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-zinc-100">Server-Uhr</h1>
          <p class="text-xs text-zinc-500 font-mono">Echtzeit Synchronisation</p>
        </div>
      </div>

      <!-- Status Indicator Badge -->
      <div id="status-badge" class="flex items-center gap-2.5 px-3 py-1.5 rounded-full bg-zinc-950/60 border border-zinc-800">
        <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-zinc-600 transition-all duration-300"></span>
        <span id="status-text" class="text-xs font-semibold tracking-wider text-zinc-400 uppercase font-mono">Verbinde...</span>
      </div>
    </header>

    <!-- Digital Time Display Section -->
    <section class="flex flex-col items-center justify-center py-6 px-4 bg-zinc-950/90 rounded-2xl border border-zinc-800/80 shadow-inner relative overflow-hidden group">
      <!-- Ambient Background Glow -->
      <div id="ambient-glow" class="absolute inset-0 bg-emerald-500/5 blur-2xl transition-opacity duration-500 opacity-0 pointer-events-none"></div>
      
      <div class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-3 flex items-center gap-2">
        <span>Aktuelle Serverzeit</span>
        <span class="text-zinc-700">•</span>
        <span class="text-zinc-500">24H UTC/Local</span>
      </div>

      <!-- Digital Time Text -->
      <div id="time-display" class="font-mono text-5xl sm:text-6xl md:text-7xl font-bold tracking-wider text-zinc-500 transition-colors duration-300 py-2">
        --:--:--
      </div>

      <div class="mt-3 text-[11px] font-mono text-zinc-500 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Intervall: 5000 ms</span>
      </div>
    </section>

    <!-- Error Banner (Hidden by default) -->
    <div id="error-banner" class="hidden p-4 bg-rose-950/40 border border-rose-800/60 rounded-xl text-rose-300 text-xs flex items-start gap-3 animate-fade-in">
      <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <div class="flex-1">
        <p class="font-semibold text-rose-200 mb-0.5">Verbindungsfehler</p>
        <p id="error-msg" class="text-rose-400/90 leading-relaxed">Der Server ist aktuell nicht erreichbar.</p>
      </div>
    </div>

    <!-- Footer / Manual Refresh Action -->
    <footer class="flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-zinc-800/60 pt-5 text-xs text-zinc-500">
      <div id="last-updated" class="font-mono text-zinc-500 text-center sm:text-left">
        Zuletzt geprüft: --:--:--
      </div>

      <button id="refresh-btn" type="button" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-800/80 text-zinc-200 hover:text-white font-medium rounded-xl border border-zinc-700/60 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 cursor-pointer shadow-sm">
        <svg id="refresh-icon" class="w-4 h-4 text-zinc-400 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Aktualisieren</span>
      </button>
    </footer>
  </main>

  <script>
    let pollInterval = null;
    let isFetching = false;

    async function fetchServerTime() {
      if (isFetching) return;
      isFetching = true;

      const refreshIcon = document.getElementById('refresh-icon');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const timeDisplay = document.getElementById('time-display');
      const ambientGlow = document.getElementById('ambient-glow');
      const lastUpdated = document.getElementById('last-updated');
      const errorBanner = document.getElementById('error-banner');
      const errorMsg = document.getElementById('error-msg');

      if (refreshIcon) {
        refreshIcon.classList.add('animate-spin');
      }

      try {
        const response = await fetch('/api/time');
        if (!response.ok) {
          throw new Error('HTTP Status ' + response.status);
        }

        const data = await response.json();

        if (data && typeof data.time === 'string') {
          // Safe text rendering
          timeDisplay.textContent = data.time;
          
          // Apply active online styles
          timeDisplay.className = 'font-mono text-5xl sm:text-6xl md:text-7xl font-bold tracking-wider text-emerald-400 digital-glow transition-colors duration-300 py-2';
          
          statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981] transition-all duration-300';
          statusText.textContent = 'Online';
          statusText.className = 'text-xs font-semibold tracking-wider text-emerald-400 uppercase font-mono';
          
          ambientGlow.classList.remove('opacity-0');
          ambientGlow.classList.add('opacity-100');

          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          lastUpdated.textContent = 'Zuletzt geprüft: ' + hours + ':' + minutes + ':' + seconds;

          errorBanner.classList.add('hidden');
        } else {
          throw new Error('Ungültiges Datenformat empfangen');
        }
      } catch (err) {
        // Apply offline error styles
        statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_10px_#f43f5e] transition-all duration-300 animate-pulse';
        statusText.textContent = 'Offline';
        statusText.className = 'text-xs font-semibold tracking-wider text-rose-400 uppercase font-mono';

        timeDisplay.className = 'font-mono text-5xl sm:text-6xl md:text-7xl font-bold tracking-wider text-rose-500/70 transition-colors duration-300 py-2';
        ambientGlow.classList.remove('opacity-100');
        ambientGlow.classList.add('opacity-0');

        errorMsg.textContent = 'Keine Verbindung zum Server: ' + (err.message || 'Netzwerkfehler');
        errorBanner.classList.remove('hidden');
      } finally {
        isFetching = false;
        if (refreshIcon) {
          setTimeout(() => {
            refreshIcon.classList.remove('animate-spin');
          }, 300);
        }
      }
    }

    function startAutoPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
      }
      fetchServerTime();
      pollInterval = setInterval(fetchServerTime, 5000);
    }

    document.getElementById('refresh-btn').addEventListener('click', () => {
      startAutoPolling();
    });

    // Initial immediate invocation on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      startAutoPolling();
    });
  </script>
</body>
</html>
